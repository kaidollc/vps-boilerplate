---
- name: Install PM2 globally
  shell: npm install -g pm2@{{ pm2_version }}
  args:
    executable: /bin/bash
  environment:
    PATH: "/root/.nvm/versions/node/v{{ node_version }}/bin:{{ ansible_env.PATH }}"

- name: Check PM2 version
  shell: pm2 --version
  args:
    executable: /bin/bash
  environment:
    PATH: "/root/.nvm/versions/node/v{{ node_version }}/bin:{{ ansible_env.PATH }}"
  register: pm2_version_result
  changed_when: false

- name: Show PM2 version
  debug:
    msg: "PM2 version: {{ pm2_version_result.stdout }}"
